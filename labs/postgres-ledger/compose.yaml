# Disposable local PostgreSQL for the integration lab.
# DO NOT use with production data. The tests drop their own tables.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_test"]
      interval: 5s
      timeout: 5s
      retries: 10
