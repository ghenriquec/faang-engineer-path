name: PostgreSQL ledger — integration tests

on:
  push:
    paths:
      - "labs/postgres-ledger/**"
      - ".github/workflows/postgres-ledger.yml"
  pull_request:
    paths:
      - "labs/postgres-ledger/**"
      - ".github/workflows/postgres-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGER_JDBC_URL: jdbc:postgresql://localhost:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: labs/postgres-ledger/pom.xml
      - name: Run PostgreSQL integration and concurrency tests
        run: mvn --batch-mode --no-transfer-progress -f labs/postgres-ledger/pom.xml verify
